<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="./assets/css/style.css"/>
    <title>Techman</title>
</head>
<body>
    <header>
        <h1>Techman</h1>
    </header>
    <main>
        <section class="gameDisplay">
            <div>
                <svg width="400" height="400" viewBox="0 0 300 300">

                    <!-- Gallows -->
                    <line x1="50" y1="250" x2="150" y2="250" stroke="black" stroke-width="6"/>
                    <line x1="100" y1="250" x2="100" y2="50" stroke="black" stroke-width="6"/>
                    <line x1="100" y1="50" x2="200" y2="50" stroke="black" stroke-width="6"/>
                    <line x1="200" y1="50" x2="200" y2="80" stroke="black" stroke-width="6"/>
                  
                    <!-- Head -->
                    <circle id="head"
                            cx="200"
                            cy="105"
                            r="25"
                            stroke="black"
                            stroke-width="5"
                            fill="none"/>
                  
                    <!-- Body -->
                    <line id="body"
                          x1="200"
                          y1="130"
                          x2="200"
                          y2="190"
                          stroke="black"
                          stroke-width="5"/>
                  
                    <!-- Left Arm -->
                    <line id="leftArm"
                          x1="200"
                          y1="150"
                          x2="170"
                          y2="170"
                          stroke="black"
                          stroke-width="5"/>
                  
                    <!-- Right Arm -->
                    <line id="rightArm"
                          x1="200"
                          y1="150"
                          x2="230"
                          y2="170"
                          stroke="black"
                          stroke-width="5"/>
                  
                    <!-- Left Leg -->
                    <line id="leftLeg"
                          x1="200"
                          y1="190"
                          x2="170"
                          y2="230"
                          stroke="black"
                          stroke-width="5"/>
                  
                    <!-- Right Leg -->
                    <line id="rightLeg"
                          x1="200"
                          y1="190"
                          x2="230"
                          y2="230"
                          stroke="black"
                          stroke-width="5"/>
                  
                  </svg>
            </div>
            <div>
                <div id="secret"></div>
            </div>
        </section>
        <section class="keyboardDisplay">
            <div id="keyboard"></div>
        </section>
        <div id="modal" class="hidden">
            <div id="modalBox">
                <h2 id="modalMessage"></h2>
                <div id="modalButtons">
                    <button id="playAgainBtn">Play Again</button>
                    <button id="noThanksBtn">No Thanks</button>
                </div>
            </div>
        </div>
    </main>

    <script src="./assets/js/game.js"></script>

</body>
</html>
